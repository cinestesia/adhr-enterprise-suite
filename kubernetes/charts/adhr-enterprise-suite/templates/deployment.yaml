apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ .Release.Name }}
    labels:
        app: {{ .Release.Name }}
        part-of: adhr-enterprise-suite
        env: {{ .Values.ambiente | default "development" }}
        version: {{ .Values.image.tag | quote }}
        managed-by: {{ .Release.Service }}
spec:
    replicas: {{ .Values.replicaCount }}
    selector:
        matchLabels:
            app: {{ .Release.Name }}
    template:
        metadata:
            labels:
                app: {{ .Release.Name }}
                env: {{ .Values.ambiente | default "development" }}
                version: {{ .Values.image.tag | quote }}
        spec:
            containers:
                - name: {{ .Release.Name }}
                  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
                  imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
                  resources:
                    {{- toYaml .Values.resources | nindent 22 }}
                  ports:
                      - containerPort: {{ .Values.service.port }}
                        name: http
                  env:
                      {{- range $key, $val := .Values.env }}
                      - name: {{ $key }}
                        value: {{ $val | quote }}
                      {{- end }}
                      {{- range $key, $val := .Values.secretEnv }}
                      - name: {{ $key }}
                        value: {{ $val | quote }}
                      {{- end }}
                  # --- SEZIONE PROBES CON CONTROLLO DI SICUREZZA ---
                  {{- if .Values.probes }}
                  livenessProbe:
                      httpGet:
                          path: {{ .Values.probes.liveness.path | default "/api/health" }}
                          port: http
                      initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default 15 }}
                      periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 20 }}

                  readinessProbe:
                      httpGet:
                          path: {{ .Values.probes.readiness.path | default "/api/health" }}
                          port: http
                      initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default 5 }}
                      periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 10 }}

                  startupProbe:
                      httpGet:
                          path: {{ .Values.probes.startup.path | default "/api/health" }}
                          port: http
                      failureThreshold: {{ .Values.probes.startup.failureThreshold | default 30 }}
                      periodSeconds: {{ .Values.probes.startup.periodSeconds | default 5 }}
                  {{- end }}