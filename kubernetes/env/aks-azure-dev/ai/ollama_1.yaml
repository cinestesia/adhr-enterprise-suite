apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-pvc

      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              sleep 5
              ollama pull tinyllama
              ollama pull phi
              pkill ollama
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "2"
              memory: "3Gi"
            limits:
              cpu: "4"
              memory: "6Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      containers:
        - name: embeddings
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir sentence-transformers fastapi uvicorn &&
              python - << 'EOF'
              from fastapi import FastAPI
              from pydantic import BaseModel
              from sentence_transformers import SentenceTransformer

              app = FastAPI()
              model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")

              class Input(BaseModel):
                  input: list[str]

              @app.post("/embeddings")
              def embed(data: Input):
                  vectors = model.encode(data.input).tolist()
                  return {"data": [{"embedding": v} for v in vectors]}
              
              import uvicorn
              uvicorn.run(app, host="0.0.0.0", port=8000)
              EOF
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "3Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
spec:
  selector:
    app: embeddings
  ports:
    - port: 8000
      targetPort: 8000